[workspace]
name = "site"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.*"
hugo = ">=0.164"
requests = "*"
pyyaml = "*"
pyzotero = "*"
# The CV (cv/cv.typ). conda drops fonts in $CONDA_PREFIX/fonts, which typst does
# not scan on its own — hence --font-path in the `cv` task. Fira Sans, neat-cv's
# default heading face, is not packaged for conda-forge, so cv.typ asks for
# Roboto and Open Sans instead. fontawesome carries the contact icons; without
# it they compile to tofu.
typst = "0.15.*"
font-ttf-roboto = "*"
font-ttf-opensans = "*"
font-otf-fontawesome = "7.*"

# `orcid-sync` only. ORCID has no write path short of the paid Member API, and
# that could not edit this record anyway (see "Syncing to ORCID" in AGENTS.md),
# so the sync drives a signed-in browser session instead. The login is always
# manual — playwright is here to hold the session, not to type a password.
#
# `playwright-python` is the Pythonic API; plain `playwright` is the Node CLI,
# which it depends on. It needs no browser download — tools/sync_orcid.py prefers
# the system Chrome and only falls back to `playwright install chromium`.
playwright-python = "*"

[tasks]
# Regenerate data/outputs.json from Zotero (source of truth). Needs an API key —
# without one it falls back to CHECK mode and only verifies. `--help` explains both.
outputs = "python tools/update-site-outputs.py"
# Compare Zotero (truth) with ORCID, and apply the difference through a signed-in
# browser session. Dry-run by default; `--apply` writes, `--report` writes the
# difference as Markdown instead. Never in a composite gate — applying is a
# network *write* and needs a human-established login, like `check-sync`.
orcid-sync = "python tools/sync_orcid.py"
# Regenerate data/funding.json from the ORCID record's funding section (its
# source of truth). Key-less, so `--check` below is the very same code path.
funding = "python tools/update-funding.py"
# Regenerate data/interests.json from the ORCID record's Keywords, the source of
# truth for the hero pills and the CV's Interests list. Key-less, likewise.
interests = "python tools/update-interests.py"

# ---- Individual checks (each runnable on its own) ------------------------- #
# Content front-matter, DOI/key references, thesis->project links, covers, and
# the static/ size rule. Offline and instant.
check-content = "python tools/validate_content.py"
# data/outputs.json still matches Zotero. Key-less: verifies, never writes.
check-outputs = "python tools/update-site-outputs.py --check"
# The site's hand-picked `featured:` works are all starred on ORCID (site list
# must be a subset; ORCID may star more). Key-less; an ORCID outage warns.
check-featured = "python tools/check_featured.py"
# data/funding.json still matches the ORCID record. Verifies, never writes; an
# ORCID outage warns rather than failing, as with check-outputs.
check-funding = "python tools/update-funding.py --check"
# data/interests.json still matches the ORCID record's Keywords. Same contract.
check-interests = "python tools/update-interests.py --check"
# Every link in the built site; fails on any dead link. It reads ./public, so it
# *builds* first — declared, not assumed, so it is correct standalone and in any
# order inside `validate`. --root-dir resolves root-relative (/foo) links.
check-links = { cmd = "lychee --config lychee.toml --root-dir \"$PIXI_PROJECT_ROOT/public\" public", depends-on = ["build"] }
# Everything in idiap-public/ is already published. Dry run; fails and names the
# files if not. Needs SSH, so it is never part of a composite gate and never runs
# in CI — invoke it by hand after `idiap-push`.
check-sync = "sh tools/check-idiap-sync.sh"
# File hygiene only: whitespace, TOML/JSON/YAML, ruff, no submodules. Every
# project-specific check is a pixi task in `validate`, never a prek hook, so
# nothing is defined in two places.
lint = "prek run --all-files"

# THE gate — hygiene, unit tests, content, publication data, and a link check over
# a freshly built site. Run it after any change; it is also exactly what CI runs.
# Ordered so failures come back fast and legibly: offline before network, build
# last, and `test` ahead of both checkers because it covers the code they run
# (test_static_rule.py -> validate_content.py, test_pipeline.py -> zotero_common.py).
# A broken tool then fails as a named assertion, not as a puzzling content error.
validate = { depends-on = ["lint", "test", "check-content", "check-outputs", "check-featured", "check-funding", "check-interests", "check-links"] }
# Unit tests for the publications pipeline (offline, fixture-based).
# -v names each test as it runs, so a failure in the gate says what broke.
test = "pytest -v tools/tests"
# Everything the CV borrows from the website (publications, theses, courses,
# projects) as one YAML file, because typst cannot read Markdown front matter.
# Generated, git-ignored, and rebuilt on every `cv`.
cv-data = "python tools/build-cv.py"
# The CV PDF. --root . lets cv.typ read /data/*.json and /hugo.toml directly.
# It lands in static/, NOT public/: `build` below wipes public/, so writing the
# PDF before Hugo runs keeps the whole thing one linear chain and lets
# check-links verify the download link against a real file.
cv = { cmd = 'typst compile --root . --font-path "$CONDA_PREFIX/fonts" cv/cv.typ static/andre-anjos-cv.pdf', depends-on = ["cv-data"] }
# Rebuild the CV on every save. Site data changes need `cv-data` re-run by hand.
cv-watch = { cmd = 'typst watch --root . --font-path "$CONDA_PREFIX/fonts" cv/cv.typ static/andre-anjos-cv.pdf', depends-on = ["cv-data"] }
# Build the static site (broken internal refs fail via refLinksErrorLevel=ERROR).
# --cleanDestinationDir removes stale output so link checks stay honest.
build = { cmd = "hugo --minify --cleanDestinationDir", depends-on = ["cv"] }
# Local preview with drafts and live reload. Deliberately has NO dependencies:
# preview must never wait on a Zotero round-trip.
serve = "hugo server -D"
clean = "rm -rf public resources/_gen cv/generated.yaml static/andre-anjos-cv.pdf"
# Publish the large assets (PDFs, raw images) to ~/public on the Idiap web
# server, where they are served as https://www.idiap.ch/~aanjos/<path>.
# Additive: no --delete, so it never removes anything already on the server.
# -a preserves the local 644/755 modes, which is what the web server needs
# (macOS ships openrsync, which has no --chmod).
idiap-push = "rsync -avz idiap-public/ idiap:public/"
# Refresh the local mirror from the server. Additive: never deletes locally.
idiap-pull = "rsync -avz idiap:public/ idiap-public/"

[feature.qa.dependencies]
prek = "*"
lychee = "*"
pytest = "*"

[environments]
default = { features = ["qa"] }
