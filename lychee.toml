# Link-checker configuration (https://lychee.cli.rs).
# Runs over ./public in CI and fails the build on any broken link.

no_progress = true
cache = true
max_cache_age = "2d"
timeout = 20
max_retries = 2
retry_wait_time = 2

# Rate-limit / bot-blocking is not a broken link.
accept = ["200..=206", "429"]

# Hosts that block automated checkers (return 999/403 to bots) or heavily
# rate-limit. DOIs are already validated upstream via Crossref/ORCID.
exclude = [
  # Temporary: the correct IMAGIN-AIR project URL currently returns 404.
  # Still checked with a warning by tools/check-links.sh; remove this entry
  # and lychee-warnings.toml's include entry once the page is available.
  "^https://www\\.idiap\\.ch/en/projects/imagin-air$",
  # Own domain: canonical/og:url point at the production site, which only
  # resolves post-deploy. Internal links are checked via root-relative paths.
  "^https://anjos\\.ai",
  "ieeexplore\\.ieee\\.org",
  "linkedin\\.com",
  "scholar\\.google\\.",
  "stackoverflow\\.com",
  "x\\.com",
  "twitter\\.com",
  "doi\\.org",
  # Public Zotero PDF links 302-redirect to short-lived signed S3 URLs (60s
  # expiry) that can't be reliably re-fetched; verified live when uploaded.
  "api\\.zotero\\.org",
  # Vimeo's embed endpoint 403s any non-browser client (the video is unlisted
  # and embed-restricted). The canonical page vimeo.com/<id> is checked instead.
  "player\\.vimeo\\.com",
  # The BEAT platform keeps its own URL as the canonical reference to the
  # platform, even though the service is retired and the host now answers 503.
  # The link is deliberate, so the checker must not fail a deploy over it. Note
  # this excludes only `/software/beat/platform/`: the bare `/software/beat/`
  # and `/software/bob/` pages were retired differently, and now point at
  # GitLab (`Docs:` in their Zotero items), where they are checked normally.
  "^https://www\\.idiap\\.ch/software/beat/platform/",
  # Idiap's GitLab does not answer reliably from cloud CI runners (GitHub
  # Actions), while it is perfectly reachable from Idiap. Excluding it here
  # keeps `check-links` a hard gate for everything else; the URLs themselves
  # are still checked by `check-links-idiap`, which uses --include to override
  # this line and is fatal locally but only warns under CI. Keep the two in
  # step: a host listed here and nowhere else is a host nobody checks.
  "gitlab\\.idiap\\.ch",
]
