{{ define "main" }}
<div class="wide band">
  {{ partial "sec-head.html" (dict "icon" "theses" "text" .Title "level" "h1") }}
  {{ .Content }}
  {{ with .Pages.ByDate.Reverse }}
  <ul class="card-grid card-grid--two">
    {{- range . }}
    {{- partial "card.html" (dict "page" . "meta" (partial "thesis-meta.html" .) "variant" "vertical") }}
    {{- end }}
  </ul>
  {{ end }}
</div>
{{ end }}
